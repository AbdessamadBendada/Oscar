<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPS DETOX™: About hero, framed-to-full-bleed</title>
<link rel="icon" href="assets/logo/favicon.png">
<link rel="stylesheet" href="css/site.css">
<!-- ==========================================================
     OPTION A, revised 29 Oct. The two static options were both rejected.
     This is A with two changes:

       1. The caption line moved INSIDE the picture, under the name, so the
          whole block is one object and nothing hangs below the frame.
       2. It animates. The page opens on the framed picture exactly where
          it sat before, then the frame grows to full width and full height
          and the lime border and the corner radius resolve away.

     The animation is on the BOX, not on a transform. A transform:scale
     would be cheaper to composite, but it scales the name and the caption
     with the picture, so the type would arrive at the wrong size and look
     soft on the way. Growing width/height keeps the type fixed while the
     picture opens around it, which is the effect asked for. It costs a
     layout pass per frame on one element with no siblings in flow, which
     is affordable for a one-shot hero and nothing else on the page moves.
     ========================================================== -->
<style>
  /* The header is Deep Green here for the same reason it is on the
     homepage: the lime logo, lime nav and lime pill CTA have no other
     legal ground (V1.0 p.21). It is NOT sticky — once the picture is
     full-bleed a pinned header would sit on top of the name. */
  .site-header{
    position:static;
    background:var(--ink);
    border-bottom:1px solid rgba(204,254,6,.22);
  }
  .site-nav a{color:var(--lime)}
  .site-header .header-cta{background:var(--lime);color:var(--ink);border-color:var(--lime)}
  .site-header .nav-toggle{border-color:var(--lime)}
  .site-header .nav-toggle i,
  .site-header .nav-toggle i::before,
  .site-header .nav-toggle i::after{background:var(--lime)}

  /* The section's own padding is what insets the frame at rest, so it has
     to animate to zero in step with the frame reaching 100vw — otherwise
     the frame hits full width and the padding holds it short of the edge. */
  .ah{
    display:grid;place-items:center;
    background:var(--ink);
    padding:var(--ah-pad);
    --ah-pad:clamp(28px,5vw,70px);
    overflow:hidden;
  }
  .ah-frame{
    position:relative;
    /* The row MUST be definite. Left as the implicit auto row, it sized to
       the photograph's intrinsic height — a tall portrait, so the row grew
       far past the frame, and the bottom-aligned plate went with it and was
       clipped by the overflow:hidden below. minmax(0,1fr) against the
       frame's explicit height pins the row to the frame. */
    display:grid;grid-template-areas:"stack";grid-template-rows:minmax(0,1fr);
    width:var(--ah-w);height:var(--ah-h);
    /* At rest: the 1180px frame at 16:9. Both are custom properties so the
       keyframes have a single thing to move and the resting values stay
       readable. The second term is the 16:9 height of a frame that has run
       out of room and is narrower than 1180. */
    --ah-w:min(1180px,100%);
    --ah-h:min(664px,calc((100vw - var(--ah-pad) * 2) * .5625));
    border:6px solid var(--lime);
    border-radius:var(--r-card);
    overflow:hidden;
    /* TWO animations, not one. The border and the radius were in the same
       keyframes as --ah-w / --ah-h and were not interpolating: the frame
       reached full width still carrying its 6px lime edge and its 36px
       corners. Custom properties and ordinary properties do not have to
       share a block, and keeping them apart means a problem in one cannot
       take the other down. Same duration, delay and curve, so they still
       resolve together. Literal values here — no var() — for the same
       reason. */
    animation:
      ahOpen 1.15s .85s cubic-bezier(.65,0,.2,1) both,
      ahEdge 1.15s .85s cubic-bezier(.65,0,.2,1) both;
  }
  .ah-frame>*{grid-area:stack}
  .ah-pic{
    width:100%;height:100%;object-fit:cover;display:block;
    /* The photograph is a tall portrait opening into a landscape frame, so
       the crop is doing real work and it has to hold at BOTH sizes. 50% 26%
       keeps his face in the upper third and leaves the run of steps across
       the bottom, which is the band the name and caption sit on. Re-check
       it at the end state as well as the start if the ratios change. */
    /* The crop has to be animated, not fixed. The frame does not just grow,
       it grows WIDER relative to its height, so a single object-position
       that frames him at rest crops into his head once the picture is
       full-bleed. 46% suits the small frame, 34% suits the full-bleed one;
       moving between them keeps his head clear of the top edge throughout.
       Re-measure both ends if the frame ratios change. */
    object-position:50% var(--ah-crop);
    --ah-crop:46%;
    animation:ahCrop 1.15s .85s cubic-bezier(.65,0,.2,1) both;
  }

  /* Name and caption share one scrim so they read as a single plate rather
     than as two things that happen to be over a photograph. */
  .ah-plate{
    align-self:end;justify-self:stretch;
    padding:14vh 24px 26px;
    background:linear-gradient(to top,
      rgba(20,51,24,.94) 0%,rgba(20,51,24,.86) 42%,rgba(20,51,24,0) 100%);
    text-align:center;
  }
  .ah-name{
    margin:0;color:var(--lime);
    font-family:var(--display);font-weight:400;
    font-size:clamp(34px,9.4vw,118px);line-height:.92;
    letter-spacing:.015em;text-transform:uppercase;
  }
  .ah-cap{
    display:flex;flex-wrap:wrap;gap:8px 22px;
    align-items:baseline;justify-content:center;
    margin:16px 0 0;color:rgba(204,254,6,.78);
    font:13px/1.3 var(--display);letter-spacing:.1em;text-transform:uppercase;
  }

  /* The frame opens to the full viewport MINUS the header, not to 100vh:
     the header is in flow above it, so a 100vh frame would push its own
     bottom edge off the screen and the caption with it. --header-h is the
     token site.css already keeps for exactly this.

     svh, not vh, so the mobile browser chrome collapsing mid-animation
     does not retarget the end state halfway through.

     Every value is stated at BOTH ends. An empty from{} leaves the border
     and the radius to the implicit from-value, and they were snapping
     rather than interpolating — the frame kept its 6px lime edge and its
     corner radius at full size and only dropped them at the end. Spelling
     the start values out is what makes the border thin away and the
     corners square off over the whole 1.15s. */
  @keyframes ahOpen{
    from{
      --ah-w:min(1180px,100%);
      --ah-h:min(664px,calc((100vw - var(--ah-pad) * 2) * .5625));
    }
    to{
      --ah-w:100vw;
      --ah-h:calc(100svh - var(--header-h));
    }
  }
  /* 36px is --r-card's value, written out. */
  @keyframes ahEdge{
    from{border-width:6px;border-radius:36px}
    to{border-width:0px;border-radius:0px}
  }
  @keyframes ahCrop{from{--ah-crop:46%}to{--ah-crop:34%}}
  @property --ah-crop{syntax:"<percentage>";inherits:false;initial-value:50%}
  /* Custom properties only animate if they are registered with a type —
     without this the two sizes would snap at the halfway point instead of
     interpolating. Both are lengths. */
  @property --ah-w{syntax:"<length-percentage>";inherits:false;initial-value:0px}
  @property --ah-h{syntax:"<length-percentage>";inherits:false;initial-value:0px}

  .ah{animation:ahPad 1.15s .85s cubic-bezier(.65,0,.2,1) both}
  @keyframes ahPad{from{}to{--ah-pad:0px}}
  @property --ah-pad{syntax:"<length>";inherits:true;initial-value:0px}

  /* Reduced motion: no growth, just the end state. The full-bleed picture
     is the destination, so landing there immediately is the honest
     fallback — holding the small framed version would show a different
     design, not a calmer one. */
  @media(prefers-reduced-motion:reduce){
    .ah,.ah-frame,.ah-pic{animation:none}
    .ah{--ah-pad:0px}
    .ah-frame{--ah-w:100vw;--ah-h:calc(100svh - var(--header-h));border-width:0;border-radius:0}
    .ah-pic{--ah-crop:34%}
  }

  @media(max-width:700px){
    .ah-frame{
      --ah-h:min(520px,calc((100vw - var(--ah-pad) * 2) * 1.25));
      border-width:4px;
    }
    .ah-plate{padding:18vh 16px 20px}
    .ah-name{font-size:clamp(28px,11.5vw,54px)}
    .ah-cap{font-size:11px;gap:6px 14px}
  }
</style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="OPS DETOX home"><img src="assets/logo/primary-detoxgreen.svg" alt="OPS DETOX"></a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="detox.html">The DETOX</a>
        <a href="diagnostic.html">Audit</a>
        <a href="index.html#results">Results</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <a class="button button--small button--line header-cta" href="contact.html">Let’s talk</a>
    </div>
  </header>

  <section class="ah">
    <div class="ah-frame">
      <img class="ah-pic" src="assets/img/oscar-steps.jpg" alt="Oscar de Grauw sitting on steps">
      <div class="ah-plate">
        <!-- Wide O and D wrapped by hand: js/site.js splits on uppercase
             /([OD])/ and this is sentence case uppercased by CSS, so the
             script would never match it. -->
        <h1 class="ah-name"><i class="od">O</i>scar <i class="od">d</i>e Grauw</h1>
        <p class="ah-cap"><span>Founder, OPS Detox™</span><span>TEDx speaker</span><span>17 years inside complex international organizations</span></p>
      </div>
    </div>
  </section>

  <script src="js/site.js" defer></script>
</body>
</html>
